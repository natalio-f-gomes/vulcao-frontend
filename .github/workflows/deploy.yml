name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-south-2
  S3_BUCKET: ${{ secrets.AWS_S3_BUCKET_NAME}}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
  BUILD_DIR: build

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CI: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check secrets are set
        env:
          BUCKET: ${{ secrets.AWS_S3_BUCKET_NAME }}
          DIST: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          fail=0
          if [ -z "$BUCKET" ]; then echo " AWS_S3_BUCKET_NAME is missing"; fail=1
            else echo " AWS_S3_BUCKET_NAME is set (length: ${#BUCKET})"; fi
          if [ -z "$DIST" ];   then echo " CLOUDFRONT_DISTRIBUTION_ID is missing"; fail=1
            else echo " CLOUDFRONT_DISTRIBUTION_ID is set (length: ${#DIST})"; fi
          if [ -z "$ROLE" ];   then echo " AWS_DEPLOY_ROLE_ARN is missing"; fail=1
            else echo " AWS_DEPLOY_ROLE_ARN is set (length: ${#ROLE})"; fi
          exit $fail

      - name: Upload files
        run: |
          aws s3 sync ${{ env.BUILD_DIR }}/ s3://${{ secrets.AWS_S3_BUCKET_NAME }}

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
